name: Build and deploy guild site

on:
  push:
    branches: [main]
  schedule:
    # Daily. NOT for want of Actions minutes: this repository is PUBLIC, and public
    # repositories get standard GitHub-hosted runners free and unlimited (and 4-vCPU
    # ones at that). The "~2000 minutes/month" budget this comment used to cite was
    # never a constraint here, and it should not be quoted as a reason again.
    #
    # Daily because the INPUTS move daily at most: the draw is weekly and the member
    # data is slow. A push to main rebuilds immediately and is the reliable path when
    # a refresh is actually needed.
    #
    # 01:00 UTC is chosen for the LAG, not the hour: GitHub queues scheduled
    # workflows best-effort and defers them under load, and this repo's runs have
    # started 2h13m-4h00m late every day on record (06:00 UTC cron -> 08:13-10:00
    # UTC actual). Asking for 01:00 therefore lands the rebuild around 03:00-05:00
    # UTC, i.e. before the guild stirs, instead of mid-morning. Do NOT read the
    # cron as a promise of when the site refreshes; a push to main rebuilds
    # immediately and is the reliable path when a refresh is actually needed.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  # CHANGED 2026-08-14 from `false`. GitHub's Pages starter workflow ships `false` so
  # that a production deployment is never abandoned half-done, which is sound advice
  # for a deploy that mutates state. This one does not: the build is a pure function
  # of the guild sheet and rewrites the whole _site from scratch, so a superseded run
  # has nothing to protect — whatever it would have published, the run that superseded
  # it publishes fresher.
  #
  # What `false` cost, measured: on 2026-08-12 four pushes landed within an hour and
  # queued behind one another on this group. The 10:08 run was CREATED at 10:08:17 and
  # its first job did not start until 10:14:46 — 6m29s of a 28m26s run spent waiting
  # for a predecessor whose output was already obsolete.
  cancel-in-progress: true

jobs:
  # The suite has never gated a deploy: until now this workflow ran only
  # `python -m src.build`, so a logic regression that did not CRASH the build
  # shipped silently to Pages. That was tolerable while the objective was an
  # integer step function -- most mistakes moved a tier and were visible on the
  # page. The 2026-08-11 partial-credit migration makes the objective continuous
  # and rewrites ~15 exact-comparison sites (`== base_points`, `gain >= 0`,
  # `delta > best`), several of which fail by going QUIET rather than by raising:
  # signup._safety_swaps compares floats for equality and would simply publish an
  # empty swap list. Those are exactly the regressions only pytest catches, so no
  # green Pages deploy happens without them.
  #
  # NB "before the build" was never the requirement, only how it was first written;
  # since 2026-08-14 this job runs ALONGSIDE the build and the gate sits on `deploy`.
  # See the note on the build job for why that is the same guarantee.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same provisioning as the build job below, for the same reasons (and the
      # cache is shared between them).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run tests
        # --extra dev is the OPPOSITE of the build job's --no-dev: pytest lives in
        # the [dev] extras. scipy/numpy come with it and are used only by the
        # bake-off's optional contestant, never by the shipped optimizer.
        run: uv run --extra dev python -m pytest tests/ -q

  build:
    # NO `needs: test` — deliberately. The tests are a gate on PUBLISHING, and the only
    # step that publishes is `deploy`, so gating `deploy` on both jobs enforces exactly
    # the same guarantee (a red suite ships nothing) while letting the two jobs run
    # CONCURRENTLY. Serialising them added the whole ~5 min test job to every run's
    # wall clock to protect a build whose output is thrown away on failure anyway.
    #
    # The cost of being wrong here is one wasted runner-minute on a red build, and
    # runner minutes are free on a public repo. The cost of the old arrangement was
    # five minutes of every green one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # uv provisions Python and installs deps far faster than pip + setup-python,
      # with a warm cache across runs. It reads requires-python from pyproject.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build static site
        # --no-dev keeps the optional [dev] extras (scipy/numpy/pytest) OFF the
        # build path: the shipped optimizer is pure-Python. uv creates the env
        # and installs the project from pyproject automatically before running.
        run: uv run --no-dev python -m src.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # BOTH, and this is where the test gate actually lives. `deploy-pages` is the only
    # step in this workflow that makes anything public, so a failing suite stops the
    # site here — the artifact `build` uploaded is simply never deployed.
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
